<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow-x:hidden}
body{font-family:Montserrat,Arial,sans-serif;background:linear-gradient(180deg,#fff8fc 0%,#fff 46%,#fff7fb 100%);color:#29156e}
.page{width:100%;margin:0 auto}
.block{width:100%;max-width:442px;margin:0 auto}


.hero{position:relative;width:100%;max-width:442px;margin:0 auto;overflow:hidden;background:linear-gradient(180deg,#fae8f2 0%,#f8dcea 100%)}
.hero-bg{position:relative;display:block;width:100%;height:auto;object-fit:contain;object-position:center top}

.hero-logo{width:78%;max-width:320px;margin:0 auto 6px;filter:drop-shadow(0 2px 8px rgba(255,255,255,.36))}
.hero-slogan{margin:0 auto 8px;color:#5f5fa0;font-family:'Montserrat',Arial,sans-serif;font-size:11.5px;line-height:1.14;font-weight:800;letter-spacing:.7px;text-shadow:0 1px 0 rgba(255,255,255,.78)}
.hero-counter{display:inline-flex;align-items:center;gap:7px;min-height:31px;padding:0 13px;border:1px solid rgba(242,13,109,.18);border-radius:999px;background:rgba(255,255,255,.86);color:#f20d6d;font-size:11.5px;font-weight:800;box-shadow:0 4px 12px rgba(214,0,104,.10)}
.hero-dot{width:11px;height:11px;border-radius:50%;background:#10c97b;box-shadow:0 0 0 4px rgba(16,201,123,.12);animation:dotPulse 1.35s ease-in-out infinite}
@keyframes dotPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.15);opacity:.82}}


.barbie-text{width:100%;max-width:442px;margin:0 auto;padding:21px 14px 13px;text-align:center;color:#29156e;background:transparent;container-type:inline-size;container-name:barbieTexto}
.barbie-title{width:100%;max-width:100%;margin:0 auto;font-family:'DM Serif Display',Georgia,serif;font-size:clamp(27px,9.9cqw,34px);line-height:1.02;font-weight:400;letter-spacing:-.6px;color:#29156e}
.barbie-title .linha{display:block;width:100%;white-space:nowrap}
.barbie-title em{display:block;margin-top:4px;white-space:nowrap;color:#e50069;font-family:'DM Serif Display',Georgia,serif;font-size:1em;line-height:1.05;font-weight:400}


.benefit-strip{width:100%;max-width:442px;margin:0 auto;padding:5px 7px 18px}
.beneficios{width:100%;max-width:2048px;aspect-ratio:2048 / 468;margin:0 auto;position:relative;container-type:inline-size}
.beneficios .cards{position:absolute;left:1.074%;right:1.074%;top:7.692%;height:84.829%;display:grid;grid-template-columns:repeat(4,1fr);gap:.537cqw}
.beneficios .card{height:100%;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:4.59cqw;border:.146cqw solid #f4a4ca;background:radial-gradient(ellipse at 50% 42%,#fffafb 0%,#fff5f8 28%,#fdebf2 62%,#f9dce9 100%);box-shadow:inset 0 0 0 .34cqw rgba(255,255,255,.72),0 .10cqw .30cqw rgba(220,67,137,.16)}
.beneficios .icon{display:flex;align-items:center;justify-content:center;flex:none}.beneficios .icon svg{width:100%;height:100%;display:block;overflow:visible}
.beneficios .filmes .icon{width:5.37cqw;height:5.37cqw;margin-bottom:1.15cqw}.beneficios .qualidade .icon{width:5.76cqw;height:5.76cqw;margin-bottom:.97cqw}.beneficios .acesso .icon{width:5.96cqw;height:4.10cqw;margin-bottom:1.63cqw}.beneficios .pagamento .icon{width:5.81cqw;height:5.08cqw;margin-bottom:1.18cqw}
.beneficios .texto{font-family:Arial,Helvetica,sans-serif;font-size:2.34cqw;line-height:1.08;font-weight:900;letter-spacing:-.075cqw;text-transform:uppercase}.beneficios .pagamento .texto{font-size:2.24cqw}.beneficios .linha{display:block;white-space:nowrap}.beneficios .rosa{color:#e9005e}.beneficios .azul{color:#071c67}


.topo-oferta{width:100%;max-width:442px;margin:0 auto;padding:8px 8px 0;background:transparent;text-align:center;position:relative}
.exclusive{width:max-content;max-width:94%;min-height:52px;margin:0 auto 12px;padding:0 30px;display:flex;align-items:center;justify-content:center;gap:11px;position:relative;z-index:2;border:1px solid rgba(236,45,132,.55);border-radius:999px;background:linear-gradient(180deg,#fff 0%,#ffebf5 100%);color:#d90868;font-size:17px;font-weight:800;letter-spacing:1.4px;box-shadow:0 3px 8px rgba(214,0,104,.10)}
.exclusive .lock{font-size:19px;line-height:1}
.kicker-wrap{position:relative;width:max-content;max-width:100%;margin:0 auto 17px;z-index:2}
.kicker{width:max-content;max-width:100%;margin:0;padding:9px 13px;display:flex;align-items:center;justify-content:center;position:relative;z-index:2;border-radius:999px;border:1px solid #d99a00;background:linear-gradient(180deg,#ffeb96 0%,#ffd451 45%,#f5b91e 100%);color:#713500;font-size:clamp(9px,2.75vw,12px);line-height:1.15;font-weight:700;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.65);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 0 0 2px rgba(255,201,44,.12),0 0 8px rgba(255,190,0,.38),0 0 15px rgba(255,190,0,.17),0 3px 6px rgba(160,100,0,.12)}
.emoji-lock{margin-right:6px;font-size:14px}
.kicker-star{position:absolute;z-index:3;color:#ec3e91;font-family:Arial,sans-serif;line-height:1;pointer-events:none;text-shadow:0 0 4px rgba(236,62,145,.65),0 0 8px rgba(236,62,145,.35);animation:kickerSparkle 2.2s ease-in-out infinite}
.kicker-star-1{left:-14px;top:-5px;font-size:12px} .kicker-star-2{left:3px;bottom:-9px;font-size:7px;animation-delay:.8s} .kicker-star-3{right:-13px;top:4px;font-size:14px;animation-delay:1.2s} .kicker-star-4{right:11px;bottom:-8px;font-size:7px;animation-delay:.4s}
@keyframes kickerSparkle{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.main-title-wrap{position:relative;width:100%;margin:0 auto;display:flex;justify-content:center;z-index:2}
.main-title{position:relative;display:inline-block;margin:0;text-align:center;font-size:clamp(23px,6.5vw,31px);font-weight:800;line-height:1;letter-spacing:-1px;color:#d30a68;background:linear-gradient(180deg,#f02b83 0%,#d30a68 50%,#b90859 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:0 3px 7px rgba(215,0,99,.10)}
.desktop-title{display:inline} .mobile-title{display:none}
.main-title::after{content:"O MAIOR ACERVO DE FILMES DA";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.78) 48%,transparent 60%);background-size:220% 100%;background-position:150% 0;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;pointer-events:none;animation:titleShine 4s ease-in-out infinite}
@keyframes titleShine{0%,65%{background-position:150% 0}100%{background-position:-80% 0}}
.title-star{position:absolute;color:#ec3e91;font-family:Arial,sans-serif;line-height:1;pointer-events:none;text-shadow:0 0 4px rgba(236,62,145,.45);animation:starPulse 2.2s ease-in-out infinite}
.title-star-left{left:6px;top:1px;font-size:9px} .title-star-right{right:5px;bottom:-2px;font-size:12px;animation-delay:1s}
@keyframes starPulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.1)}}

.barbie-offer-logo{width:100%;max-width:442px;margin:0 auto;padding:6px 32px 2px;text-align:center}
.barbie-offer-logo img{width:74%;max-width:330px;margin:0 auto}


.benefits-list{width:100%;max-width:320px;margin:12px auto 0;display:flex;flex-direction:column;gap:10px}
.benefit-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:999px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.75);box-shadow:0 4px 10px rgba(214,0,104,.08);color:#9e0d58;font-size:13px;line-height:1.2;font-weight:600}
.benefit-check{width:22px;height:22px;flex:0 0 22px;display:grid;place-items:center;border-radius:50%;background:#22c55e;color:#fff;font-size:13px;font-weight:800;box-shadow:0 0 0 3px rgba(34,197,94,.14);animation:checkPulse 1.25s ease-in-out infinite}
@keyframes checkPulse{0%,100%{transform:scale(1);box-shadow:0 0 0 3px rgba(34,197,94,.14),0 0 0 rgba(34,197,94,0)}50%{transform:scale(1.10);box-shadow:0 0 0 5px rgba(34,197,94,.15),0 0 12px rgba(34,197,94,.50)}}


.preco-barbie{position:relative;width:100%;max-width:442px;margin:0 auto;padding:20px 10px 12px;text-align:center;background:transparent;overflow:hidden}
.preco-barbie .old{position:relative;z-index:3;margin:0 0 6px;color:#e11d48;font-size:14px;line-height:1.2;font-weight:800;text-decoration:line-through;text-decoration-color:#e11d48;text-decoration-thickness:2px}
.preco-barbie .price-wrap{position:relative;z-index:2;display:flex;justify-content:center;align-items:center;width:max-content;max-width:100%;margin:0 auto;isolation:isolate}
.preco-barbie .price-wrap::before{content:"";position:absolute;z-index:-1;width:100%;height:70%;left:50%;top:52%;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse at center,rgba(225,20,112,.14) 0%,rgba(225,20,112,.06) 45%,rgba(225,20,112,0) 72%);pointer-events:none}
.preco-barbie .price{position:relative;display:flex;align-items:flex-start;justify-content:center;gap:5px;margin:0;color:#d90b68;line-height:1}
.preco-barbie .currency{margin-top:12px;color:#d90b68;font-size:25px;line-height:1;font-weight:800;letter-spacing:-1px}
.preco-barbie .amount{color:#d90b68;font-family:'DM Serif Display',Georgia,serif;font-size:94px;line-height:.82;font-weight:400;letter-spacing:-4px;text-shadow:0 1px 0 rgba(255,255,255,.95),0 3px 8px rgba(217,11,104,.12)}
.preco-barbie .payment{position:relative;z-index:3;display:inline-block;margin:22px auto 0;padding:7px 18px;border:1px solid #8de0c2;background:#dff8ee;color:#087a59;font-size:12px;line-height:1;font-weight:800;letter-spacing:1px;box-shadow:0 4px 10px rgba(16,185,129,.14)}


.brand-divider{width:100%;max-width:442px;margin:20px auto 10px;padding:0 8px}
.brand-divider img{width:100%;height:auto}


.faq-wrap{width:100%;max-width:442px;margin:0 auto;padding:24px 8px 28px;background:transparent}
.faq-title{margin:0 0 7px;text-align:center;font-family:'DM Serif Display',Georgia,serif;color:#f20d6d;font-size:31px;line-height:1;font-weight:400;letter-spacing:-.3px}
.faq-subtitle{max-width:340px;margin:0 auto 16px;text-align:center;color:#75405f;font-size:14px;line-height:1.4;font-weight:500}
.faq-list{display:flex;flex-direction:column;gap:8px}
.faq-item{overflow:hidden;border:1px solid rgba(242,13,109,.20);border-radius:15px;background:rgba(255,255,255,.72)}
.faq-item summary{position:relative;min-height:52px;padding:11px 44px 11px 12px;display:flex;align-items:center;gap:9px;cursor:pointer;list-style:none;color:#9e0d58;font-size:14px;line-height:1.25;font-weight:700;user-select:none}
.faq-item summary::-webkit-details-marker{display:none} .faq-item summary::marker{content:""}
.question-icon{width:26px;height:26px;flex:0 0 26px;display:grid;place-items:center;border-radius:50%;background:#ffe0ee;font-size:14px;line-height:1}
.faq-item summary::after{content:"+";position:absolute;right:12px;top:50%;transform:translateY(-50%);width:24px;height:24px;display:grid;place-items:center;border-radius:50%;background:#f20d6d;color:#fff;font-size:18px;line-height:1}
.faq-item[open] summary::after{content:"−"} .faq-item[open] summary{color:#f20d6d}
.faq-answer{padding:0 14px 14px 47px;color:#624458;font-size:14px;line-height:1.52;font-weight:400} .faq-answer p{margin:0} .faq-answer strong{color:#971051;font-weight:700}
.contact-box{margin-top:12px;padding:14px;text-align:center;border-radius:16px;background:linear-gradient(180deg,#ff4797,#ed126f);color:#fff}
.contact-title{margin:0 0 5px;font-family:'DM Serif Display',Georgia,serif;font-size:23px;line-height:1;font-weight:400;letter-spacing:-.2px}
.contact-text{max-width:330px;margin:0 auto;font-size:13.5px;line-height:1.45;font-weight:500}
.contact-button{display:inline-block;margin-top:9px;padding:9px 15px;border-radius:999px;background:#fff;color:#f20d6d;font-size:13px;font-weight:700;text-decoration:none}

  .block,.barbie-text,.benefit-strip,.topo-oferta,.barbie-offer-logo,.preco-barbie,.brand-divider,.faq-wrap{max-width:760px}

  .benefit-strip{padding-left:0;padding-right:0}
  .topo-oferta{padding-top:20px}
  .exclusive{min-height:56px;font-size:18px}
  .kicker{font-size:13px}
  .main-title{font-size:36px}
  .barbie-offer-logo img{width:48%;max-width:360px}
  .benefits-list{max-width:420px}
  .benefit-item{font-size:14px}

  .preco-barbie .currency{font-size:28px}

  .faq-wrap{max-width:760px}
  .faq-title{font-size:38px}

}

.faq-title,.contact-title{font-family:'DM Serif Display',Georgia,serif;font-weight:400;letter-spacing:-.3px}.main-title,.compare-title,.inside-title,.steps-title,.faq-title,.contact-title{font-synthesis-weight:none}
@media(max-width:390px){
  .hero-content{top:10px;padding:0 11px}

  .desktop-title{display:none} .mobile-title{display:block}
  .main-title::after{content:"O MAIOR ACERVO DE\A FILMES DA";white-space:pre;text-align:center}
  .benefits-list{max-width:275px}
  .preco-barbie .old{font-size:13px}
  .preco-barbie .currency{margin-top:10px;font-size:22px}

  .faq-wrap{padding-left:5px;padding-right:5px}
  .faq-title{font-size:29px} .faq-subtitle,.faq-item summary,.faq-answer{font-size:13.5px}
}

@media(prefers-reduced-motion:reduce){.hero-dot,.kicker-star,.title-star,.main-title::after,.benefit-check{animation:none!important}}

:root{
  --blue:#071a8a;
  --pink:#f20d6d;
}

*{box-sizing:border-box}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  background:transparent !important;
}

body{
  font-family:Montserrat,Arial,sans-serif;
  color:var(--blue);
}

.barbie-compare{
  width:100%;
  max-width:442px;
  margin:0 auto;
  padding:10px 8px 14px;
  background:transparent !important;
  container-type:inline-size;
  container-name:barbieCompare;
}

.compare-sub{

  background:rgba(255,255,255,.24);
  box-shadow:
    0 8px 22px rgba(244,43,137,.16),
    inset 0 0 0 1px rgba(255,255,255,.58);
  backdrop-filter:blur(2px);
  -webkit-backdrop-filter:blur(2px);
}

.compare-grid{
  display:grid;
  grid-template-columns:1.22fr 1fr 1fr 1.08fr;
  gap:3px;
}

.cell{
  min-width:0;
  min-height:49px;
  padding:6px 5px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:linear-gradient(
    180deg,
    rgba(255,255,255,.84),
    rgba(255,245,252,.76)

  border:1px solid rgba(255,255,255,.9);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),

}

.head{
  min-height:63px;
  font-weight:800;
}

.feature-head{
  font-family:'DM Serif Display',Georgia,serif;
  font-size:clamp(17px,4.7cqw,24px);
  color:var(--blue);
}

.pink-head{
  background:linear-gradient(180deg,#ff42a0,#e90975);
  color:#fff;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.5),
    0 4px 13px rgba(231,0,108,.28);
}


.prime-logo-wrap{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:center;
}

  display:block;
  width:88%;

  height:auto;
  object-fit:contain;
}

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;

  color:var(--blue);

  min-height:64px;
  padding:7px 8px;

  grid-template-columns:44px 1px 1fr auto;
  align-items:center;
  gap:9px;
  color:#fff;
  background:linear-gradient(180deg,#ff2c8f,#ee0871);
  border:1px solid rgba(255,255,255,.95);
  box-shadow:

    0 7px 18px rgba(229,0,100,.18);
}

  place-items:center;
  background:rgba(255,255,255,.96);
}

.ticket{
  width:25px;
  height:18px;
  border:3px solid var(--pink);
  border-radius:4px;
  position:relative;
  transform:rotate(-12deg);

  place-items:center;
  color:var(--pink);

  font-weight:800;

  position:absolute;
  left:-5px;
  top:4px;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#fff;
  box-shadow:28px 0 0 #fff;
}

.divider{
  width:1px;
  height:38px;
  background:rgba(255,255,255,.85);
}


.footer-text{
  min-width:0;
  font-size:clamp(8.5px,2.35cqw,10.5px);
  line-height:1.22;
  font-weight:500;
  text-align:left;

  white-space:nowrap;

  line-height:1;
  font-weight:400;
  white-space:nowrap;
